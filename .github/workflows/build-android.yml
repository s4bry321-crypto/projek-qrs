name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [staff, superadmin]
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependency project
        run: npm install

      - name: Install Capacitor Android & CLI
        run: npm install @capacitor/android@latest @capacitor/cli@latest @capacitor/core@latest

      - name: Build aplikasi web (target ${{ matrix.target }})
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_TARGET: ${{ matrix.target }}

      - name: Siapkan project Android (target ${{ matrix.target }})
        run: |
          npx cap add android
          npx cap sync android
        env:
          APP_TARGET: ${{ matrix.target }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload hasil APK (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: sistem-pesan-qr-${{ matrix.target }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
